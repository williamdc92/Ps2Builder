name: build
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore PS2Builder.sln
      - name: Publish self-contained single file
        run: dotnet publish src/PS2Builder/PS2Builder.csproj -c Release -r win-x64 --self-contained true -o artifacts/PS2Builder-win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: PS2Builder-win-x64
          path: artifacts/PS2Builder-win-x64/
